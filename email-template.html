<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0a0a0a;padding:40px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background-color:#1a1a1a;border-radius:16px;border:1px solid #2a2a2a;overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="padding:32px 32px 0;text-align:center;">
              <div style="width:56px;height:56px;background-color:#2a2a2a;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px;">
                <span style="font-size:28px;">&#127760;</span>
              </div>
              <h1 style="margin:0;font-size:22px;font-weight:700;color:#ffffff;letter-spacing:-0.5px;">
                Summarizer & Translator AI
              </h1>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:24px 32px 12px;text-align:center;">
              <h2 style="margin:0 0 8px;font-size:18px;font-weight:600;color:#ffffff;">
                Verify your email
              </h2>
              <p style="margin:0;font-size:15px;color:#888888;line-height:1.6;">
                Thanks for signing up! Please confirm your email address to activate your account.
              </p>
            </td>
          </tr>

          <!-- Button -->
          <tr>
            <td style="padding:24px 32px;text-align:center;">
              <a href="https://sbkokesmer.github.io/summarizer-website/confirm.html?token_hash={{ .TokenHash }}&type=signup"
                 style="display:inline-block;padding:14px 36px;background-color:#ffffff;color:#000000;font-size:15px;font-weight:600;text-decoration:none;border-radius:12px;">
                Verify Email Address
              </a>
            </td>
          </tr>

          <!-- Note -->
          <tr>
            <td style="padding:0 32px 32px;text-align:center;">
              <p style="margin:0;font-size:13px;color:#555555;line-height:1.6;">
                If you didn't create an account, you can safely ignore this email.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px 32px;border-top:1px solid #2a2a2a;text-align:center;">
              <p style="margin:0;font-size:12px;color:#444444;">
                &copy; 2026 Summarizer & Translator AI
              </p>
              <p style="margin:4px 0 0;font-size:12px;">
                <a href="https://sbkokesmer.github.io/summarizer-website/privacy.html" style="color:#666666;text-decoration:none;">Privacy Policy</a>
                &nbsp;&middot;&nbsp;
                <a href="https://sbkokesmer.github.io/summarizer-website/terms.html" style="color:#666666;text-decoration:none;">Terms of Service</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
